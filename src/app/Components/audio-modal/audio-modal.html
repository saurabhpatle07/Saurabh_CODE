<div class="modal-overlay">
  <div class="modal-content">
    
    <!-- Header -->
    <div style="background: #6200ea; color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center;">
      <h3 style="margin: 0;">🤖 Voice Buddy</h3>
      <!-- Close button (X) behaves same as Done -->
      <button (click)="finishConversation()" style="background: none; border: none; color: white; cursor: pointer; font-size: 1.2rem;" title="Close">✕</button>
    </div>

    <!-- Chat Body -->
    <div #scrollContainer style="flex: 1; padding: 1rem; overflow-y: auto; background: #f9f9f9; display: flex; flex-direction: column; gap: 10px;">
      <div *ngFor="let msg of chatHistory">
        <div *ngIf="msg.sender === 'bot'" style="display: flex; justify-content: flex-start;">
          <div class="chat-bubble bot-bubble">{{ msg.text }}</div>
        </div>
        <div *ngIf="msg.sender === 'user'" style="display: flex; justify-content: flex-end;">
          <div class="chat-bubble user-bubble">{{ msg.text }}</div>
        </div>
      </div>
    </div>

    <!-- Footer: Audio Controls & Done Button -->
    <div style="padding: 1.5rem; border-top: 1px solid #ddd; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;">
      
      <!-- Status Text -->
      <p style="margin: 0; color: #666; font-size: 0.9rem; font-weight: 500;">
        {{ isRecording ? 'Listening...' : 'Hold button to speak' }}
      </p>

      <!-- Microphone Button -->
      <button 
        (mousedown)="startRecording()" 
        (mouseup)="stopRecording()" 
        (mouseleave)="stopRecording()"
        (touchstart)="startRecording()" 
        (touchend)="stopRecording()"
        [style.background]="isRecording ? '#ff1744' : '#6200ea'"
        [style.transform]="isRecording ? 'scale(1.1)' : 'scale(1)'"
        style="width: 70px; height: 70px; border-radius: 50%; border: none; color: white; font-size: 2rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; outline: none;">
        <span *ngIf="!isRecording">🎤</span>
        <span *ngIf="isRecording" style="width: 20px; height: 20px; background: white; border-radius: 4px; animation: pulse 1s infinite;"></span>
      </button>

      <!-- Done / Finish Button -->
      <button 
        (click)="finishConversation()"
        style="padding: 8px 16px; border: 1px solid #ddd; background: #fff; color: #333; border-radius: 20px; cursor: pointer; font-size: 0.9rem; transition: background 0.2s;"
        onmouseover="this.style.background='#f5f5f5'"
        onmouseout="this.style.background='#fff'">
        ✅ Done with Conversation
      </button>

    </div>
  </div>
</div>
