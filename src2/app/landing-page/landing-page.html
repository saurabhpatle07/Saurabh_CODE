<div
    class="container d-flex flex-column justify-content-center align-items-center vh-100 position-relative hero-section">
    <div class="row w-100 align-items-center">
        <!-- Text Content -->
        <div class="col-lg-6 mb-5 mb-lg-0 text-center text-lg-start">
            <div class="glass-card">
                <h1 class="display-3 fw-bold mb-4">
                    <span class="gradient-text">Lets Learn</span>
                </h1>
                <p class="lead text-white mb-5" style="opacity: 0.9;">
                    Step into the future of education. Interactive, immersive, and designed for you.
                </p>
                <button class="btn btn-glow btn-lg px-5 py-3 fs-4 rounded-pill" (click)="navigateToDashboard()">
                    Lets begin your journey
                </button>
            </div>
        </div>

        <!-- 3D Image Content -->
        <div class="col-lg-6">
            <img src="hero-3d.png" alt="Future Learning" class="hero-image">
        </div>
    </div>
</div>
