<h2 class="mb-4">Welcome back, John!</h2>

<div class="row g-4">
    <!-- Create Course Journey -->
    <div class="col-6 col-md-3">
        <div class="ios-card-btn bg-primary-gradient" (click)="navigateToCourseJourney()">
            <div class="icon-wrapper">🚀</div>
            <div class="card-label">Create Course Journey</div>
        </div>
    </div>

    <!-- Industry Internship -->
    <div class="col-6 col-md-3">
        <div class="ios-card-btn bg-purple-gradient" (click)="navigateToInternships()">
            <div class="icon-wrapper">💼</div>
            <div class="card-label">Industry Internship</div>
        </div>
    </div>

    <!-- Financial Help / Aid -->
    <div class="col-6 col-md-3">
        <div class="ios-card-btn bg-success-gradient" (click)="navigateToFinancialAid()">
            <div class="icon-wrapper">💰</div>
            <div class="card-label">Financial Help / Aid</div>
        </div>
    </div>

    <!-- Upcoming Events -->
    <div class="col-6 col-md-3">
        <div class="ios-card-btn bg-orange-gradient">
            <div class="icon-wrapper">📅</div>
            <div class="card-label">Upcoming Events</div>
        </div>
    </div>

    <!-- Adaptive Course Material -->
    <div class="col-6 col-md-3">
        <div class="ios-card-btn bg-red-gradient" (click)="navigateToCourseMaterial()">
            <div class="icon-wrapper">📚</div>
            <div class="card-label">Adaptive Material</div>
        </div>
    </div>

    <!-- Weak & Focus Areas -->
    <div class="col-6 col-md-3">
        <div class="ios-card-btn bg-blue-red-gradient" (click)="navigateToFocusAreas()">
            <div class="icon-wrapper">🎯</div>
            <div class="card-label">Weak & Focus Areas</div>
        </div>
    </div>

    <!-- Chat with Mentors -->
    <div class="col-6 col-md-3">
        <div class="ios-card-btn bg-cyan-gradient" (click)="navigateToMentorChat()">
            <div class="icon-wrapper">💬</div>
            <div class="card-label">Chat Expert</div>
        </div>
    </div>
</div>
